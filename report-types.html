<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نوع گزارش | سامانه راهبرد شوشتر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#020b18;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,150,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,150,255,.06) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

header{
    position:relative;
    z-index:2;
    background:#061426;
    border-bottom:1px solid #008cff;
    padding:20px;
    text-align:center;
}

header span{
    color:#00cfff;
}

.container{
    position:relative;
    z-index:2;
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h2{
    font-size:30px;
    margin-bottom:10px;
}

.title p{
    color:#9ed7ff;
}

.types{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.type{
    background:linear-gradient(
        145deg,
        rgba(8,35,65,.95),
        rgba(3,15,30,.95)
    );

    border:1px solid #008cff;
    border-radius:18px;
    padding:30px;

    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.type:hover{
    transform:translateY(-6px);
    border-color:#00cfff;
    box-shadow:0 0 25px rgba(0,170,255,.4);
}

.type .icon{
    font-size:45px;
    margin-bottom:15px;
}

.type h3{
    font-size:22px;
}

.back{
    display:block;
    width:200px;
    margin:40px auto;

    padding:14px;
    text-align:center;

    background:#06325a;
    border:1px solid #008cff;
    border-radius:12px;

    color:white;
    text-decoration:none;
}

@media(max-width:600px){

    .types{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>
    <h2>
        🔷 سامانه <span>راهبرد شوشتر</span>
    </h2>
</header>


<div class="container">

<div class="title">

<h2 id="sectionName">
در حال بارگذاری...
</h2>

<p>
نوع گزارش مورد نظر را انتخاب کنید
</p>

</div>


<div class="types" id="typesContainer">

</div>


<a href="report-sections.html" class="back">
← بازگشت
</a>

</div>


<script>

const section =
localStorage.getItem("selectedSection");

document.getElementById("sectionName").innerText =
section || "بخش گزارش‌دهی";


const reportTypes = {

"شمسا":[
"گزارش توییتر",
"گزارش اینستاگرام",
"گزارش ادیورز",
"گزارش انتشار"
],

"متنا":[
"محتوای عملیاتی",
"محتوای بومی",
"محتوای مناسبتی"
],

"مپتا":[
"ارسال خبر",
"مصاحبه"
],

"نسرا":[
"خلاقیت",
"نشست حضوری",
"لایو",
"تولید محتوا"
],

"رسانه محله":[
"گزارش روزانه",
"گزارش عملیات"
],

"رصد":[
"ارسال گزارش"
]

};


const container =
document.getElementById("typesContainer");


const icons = {
"گزارش توییتر":"🐦",
"گزارش اینستاگرام":"📸",
"گزارش ادیورز":"📱",
"گزارش انتشار":"📢",

"محتوای عملیاتی":"⚡",
"محتوای بومی":"🏘️",
"محتوای مناسبتی":"🎉",

"ارسال خبر":"📰",
"مصاحبه":"🎤",

"خلاقیت":"💡",
"نشست حضوری":"🤝",
"لایو":"🔴",
"تولید محتوا":"🎬",

"گزارش روزانه":"📅",
"گزارش عملیات":"⚙️",

"ارسال گزارش":"🔍"
};


if(reportTypes[section]){

reportTypes[section].forEach(function(type){

const card =
document.createElement("div");

card.className="type";

card.innerHTML=`

<div class="icon">
${icons[type] || "📝"}
</div>

<h3>${type}</h3>

`;

card.onclick=function(){

localStorage.setItem(
"selectedReportType",
type
);

window.location.href=
"report-form.html";

};

container.appendChild(card);

});

}

</script>

</body>
</html>
