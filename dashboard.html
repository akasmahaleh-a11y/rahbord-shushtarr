<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل | سامانه راهبرد شوشتر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, Arial, sans-serif;
}

body{
    background:#020b18;
    color:white;
    min-height:100vh;
}

/* پس زمینه سایبری */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,150,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,150,255,.05) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

/* هدر */

header{
    position:relative;
    z-index:2;
    height:75px;
    background:#061426;
    border-bottom:1px solid #008cff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo{
    color:#fff;
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#00bfff;
}

.user{
    color:#a9dcff;
}

/* محتوا */

.container{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.welcome{
    text-align:center;
    margin-bottom:45px;
}

.welcome h1{
    font-size:32px;
    margin-bottom:15px;
}

.welcome p{
    color:#9ed7ff;
}

/* کارت ها */

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
}

.card{
    background:linear-gradient(
        145deg,
        rgba(8,30,55,.95),
        rgba(3,15,30,.95)
    );

    border:1px solid #008cff;
    border-radius:22px;
    padding:50px 30px;

    text-align:center;

    box-shadow:
    0 0 20px rgba(0,130,255,.15),
    inset 0 0 20px rgba(0,100,255,.05);

    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:
    0 0 35px rgba(0,170,255,.45);
}

.icon{
    font-size:60px;
    margin-bottom:20px;
}

.card h2{
    font-size:28px;
    margin-bottom:15px;
}

.card p{
    color:#a7d8f7;
    line-height:1.8;
    margin-bottom:25px;
}

.card button{
    width:180px;
    padding:14px;

    border:1px solid #00aaff;
    border-radius:12px;

    background:#06325a;
    color:white;

    font-size:16px;
    cursor:pointer;

    transition:.3s;
}

.card button:hover{
    background:#008cff;
    box-shadow:0 0 20px #008cff;
}

/* پایین صفحه */

footer{
    position:relative;
    z-index:2;
    text-align:center;
    color:#6eaed6;
    padding:30px;
}

/* موبایل */

@media(max-width:700px){

    header{
        padding:0 15px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .welcome h1{
        font-size:25px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        🔷 سامانه <span>راهبرد شوشتر</span>
    </div>

    <div class="user">
        👤 کاربر
    </div>

</header>


<div class="container">

    <div class="welcome">

        <h1>به سامانه راهبرد شوشتر خوش آمدید</h1>

        <p>
            مدیریت هوشمند حوزه‌ها، تجهیزات و گزارش‌ها
        </p>

    </div>


    <div class="cards">


        <!-- حوزه ها -->

        <div class="card">

            <div class="icon">
                🏢
            </div>

            <h2>
                حوزه‌ها
            </h2>

            <p>
                مشاهده حوزه‌ها و ثبت گزارش‌های هر حوزه
            </p>

            <button onclick="goAreas()">
                ورود به بخش
            </button>

        </div>


        <!-- تجهیزات -->

        <div class="card">

            <div class="icon">
                ⚙️
            </div>

            <h2>
                تجهیزات حوزه
            </h2>

            <p>
                مدیریت و مشاهده تجهیزات حوزه‌ها
            </p>

            <button onclick="goEquipment()">
                ورود به بخش
            </button>

        </div>


    </div>

</div>


<footer>

سامانه راهبرد شوشتر | مدیریت هوشمند گزارش‌ها

</footer>


<script>

function goAreas(){

    alert("در مرحله بعد بخش حوزه‌ها را متصل می‌کنیم");

}


function goEquipment(){

    alert("در مرحله بعد بخش تجهیزات را متصل می‌کنیم");

}

</script>

</body>
</html>
