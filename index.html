<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سامانه راهبرد شوشتر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(2,10,25,.78),rgba(2,10,25,.92)),
    url("https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
    color:white;
}

/* خطوط سایبری */

body:before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,170,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,170,255,.08) 1px,transparent 1px);
    background-size:45px 45px;
    pointer-events:none;
}

/* صفحه اصلی */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:80px;
    padding:30px;
    position:relative;
}

/* بخش معرفی */

.brand{
    width:500px;
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    border:3px solid #00aaff;
    border-radius:30px;
    margin:auto auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    color:#00cfff;
    box-shadow:
    0 0 20px #0088ff,
    inset 0 0 20px #0088ff;
}

.brand h1{
    font-size:42px;
    margin-bottom:18px;
}

.brand h1 span{
    color:#00bfff;
}

.brand p{
    font-size:20px;
    line-height:2;
    color:#c9eaff;
}

.sections{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:35px;
    flex-wrap:wrap;
}

.sections span{
    border:1px solid #008cff;
    padding:12px 18px;
    border-radius:12px;
    background:rgba(0,80,150,.25);
    color:#dff6ff;
}

/* کارت ورود */

.login-box{
    width:430px;
    background:rgba(4,16,35,.88);
    border:1px solid #00aaff;
    border-radius:25px;
    padding:40px;
    box-shadow:
    0 0 30px rgba(0,150,255,.45),
    inset 0 0 30px rgba(0,100,255,.08);
    backdrop-filter:blur(12px);
}

.lock{
    width:80px;
    height:80px;
    margin:auto;
    border:2px solid #00cfff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    box-shadow:0 0 20px #0088ff;
}

.login-box h2{
    text-align:center;
    margin:25px 0 12px;
    font-size:30px;
}

.login-box .subtitle{
    text-align:center;
    color:#b9dff5;
    line-height:1.9;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#bde8ff;
}

.input-group input{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #147dcc;
    background:#07182d;
    color:white;
    outline:none;
    font-size:16px;
}

.input-group input:focus{
    border-color:#00cfff;
    box-shadow:0 0 12px #0077ff;
}

.login-btn{
    width:100%;
    border:none;
    padding:17px;
    border-radius:12px;
    background:linear-gradient(90deg,#0066ff,#00bfff);
    color:white;
    font-size:19px;
    cursor:pointer;
    margin-top:10px;
    box-shadow:0 0 20px rgba(0,150,255,.5);
}

.login-btn:hover{
    transform:scale(1.02);
}

.security{
    text-align:center;
    color:#8fc7e8;
    margin-top:25px;
    font-size:13px;
}

/* موبایل */

@media(max-width:900px){

    .login-page{
        flex-direction:column;
        gap:35px;
        padding:25px 15px;
    }

    .brand{
        width:100%;
    }

    .brand h1{
        font-size:32px;
    }

    .brand p{
        font-size:16px;
    }

    .login-box{
        width:100%;
        max-width:430px;
    }

}

</style>
</head>

<body>

<div class="login-page">

    <div class="brand">

        <div class="logo">
            ◆
        </div>

        <h1>
            سامانه <span>راهبرد</span> شوشتر
        </h1>

        <p>
            سامانه جامع مدیریت، گزارش‌دهی و گزارش‌گیری
            <br>
            حوزه‌ها و تجهیزات
        </p>

        <div class="sections">
            <span>شمسا</span>
            <span>متنا</span>
            <span>مپتا</span>
            <span>نسرا</span>
            <span>رصد</span>
            <span>رسانه محله</span>
        </div>

    </div>


    <div class="login-box">

        <div class="lock">
            🔐
        </div>

        <h2>خوش آمدید</h2>

        <div class="subtitle">
            برای ورود به سامانه راهبرد شوشتر
            <br>
            کد کاربری و رمز عبور خود را وارد کنید
        </div>


        <div class="input-group">
            <label>کد کاربری</label>
            <input
            type="text"
            id="username"
            placeholder="کد کاربری را وارد کنید">
        </div>


        <div class="input-group">
            <label>رمز عبور</label>
            <input
            type="password"
            id="password"
            placeholder="رمز عبور را وارد کنید">
        </div>


        <button class="login-btn" onclick="login()">
            ورود به سامانه ←
        </button>


        <div class="security">
            🔒 فقط کاربران مجاز امکان ورود دارند
        </div>

    </div>

</div>


<script>

function login(){

    let username =
    document.getElementById("username").value;

    let password =
    document.getElementById("password").value;


    if(username === "" || password === ""){

        alert("لطفاً کد کاربری و رمز عبور را وارد کنید");

    }

    else{

        alert("مرحله ورود آماده شد. در مرحله بعد آن را به سیستم واقعی متصل می‌کنیم.");

    }

}

</script>

</body>
  </html>
