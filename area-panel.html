<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل حوزه | سامانه راهبرد شوشتر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#020b18;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,150,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,150,255,.06) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

header{
    position:relative;
    z-index:2;
    background:#061426;
    border-bottom:1px solid #008cff;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:23px;
}

header span{
    color:#00cfff;
}

.container{
    position:relative;
    z-index:2;
    max-width:1000px;
    margin:auto;
    padding:45px 20px;
}

.area-title{
    text-align:center;
    margin-bottom:45px;
}

.area-title p{
    color:#9ed7ff;
    margin-bottom:12px;
}

.area-title h2{
    color:white;
    font-size:28px;
    line-height:1.8;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
}

.card{
    background:linear-gradient(
        145deg,
        rgba(8,35,65,.95),
        rgba(3,15,30,.95)
    );

    border:1px solid #008cff;
    border-radius:22px;

    padding:55px 30px;
    text-align:center;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 0 20px rgba(0,130,255,.15);
}

.card:hover{
    transform:translateY(-8px);
    border-color:#00cfff;

    box-shadow:
    0 0 35px rgba(0,170,255,.45);
}

.icon{
    font-size:70px;
    margin-bottom:20px;
}

.card h3{
    font-size:28px;
    margin-bottom:15px;
}

.card p{
    color:#9ed7ff;
    line-height:1.9;
}

.back{
    display:block;
    width:220px;
    margin:45px auto 0;

    text-align:center;
    padding:14px;

    border:1px solid #008cff;
    border-radius:12px;

    background:#06325a;

    color:white;
    text-decoration:none;
}

@media(max-width:700px){

    .cards{
        grid-template-columns:1fr;
    }

    .area-title h2{
        font-size:22px;
    }

}

</style>

</head>

<body>

<header>

<h1>
🔷 سامانه <span>راهبرد شوشتر</span>
</h1>

</header>


<div class="container">

<div class="area-title">

<p>حوزه انتخاب شده</p>

<h2 id="areaName">
در حال بارگذاری...
</h2>

</div>


<div class="cards">


<div class="card" onclick="goReport()">

<div class="icon">
📝
</div>

<h3>
گزارش‌دهی
</h3>

<p>
ثبت گزارش فعالیت‌های حوزه
</p>

</div>


<div class="card" onclick="goReports()">

<div class="icon">
📊
</div>

<h3>
گزارش‌گیری
</h3>

<p>
مشاهده و بررسی گزارش‌های ثبت شده
</p>

</div>


</div>


<a href="areas.html" class="back">

← بازگشت به حوزه‌ها

</a>

</div>


<script>

let area =
localStorage.getItem("selectedArea");

if(area){

document.getElementById("areaName").innerText =
area;

}else{

document.getElementById("areaName").innerText =
"حوزه انتخاب نشده";

}


function goReport(){

window.location.href =
"report-sections.html";

}


function goReports(){

alert("بخش گزارش‌گیری در مرحله بعد ساخته می‌شود");

}

</script>

</body>
</html>
